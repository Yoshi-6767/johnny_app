{% extends "base.html" %}

{% block title %}Своя тема — Flow & Word{% endblock %}

{% block styles %}
<style>
    .topic-form {
        max-width: 500px;
    }
    .topic-form input {
        width: 100%;
        padding: 16px 20px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-size: 16px;
        font-family: 'Rubik', sans-serif;
        outline: none;
        margin-bottom: 20px;
    }
    .topic-form input:focus { border-color: var(--accent); }
</style>
{% endblock %}

{% block content %}
<div class="topic-form">
    <h1>➕ Своя тема</h1>
    <div class="subtitle">Напиши название темы на английском</div>

    <form method="POST">
        <input name="title" placeholder="Например: My Job" required autofocus>
        <button type="submit" class="btn" style="width: 100%;">Создать</button>
    </form>
</div>
{% endblock %}
