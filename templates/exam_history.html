<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История экзаменов — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/games">Игры</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🎓 История экзаменов</h1>
        <div class="subtitle">Все твои экзаменационные работы</div>

        <div style="margin-bottom: 25px;">
            <a href="/exam" class="btn">🎓 Новый экзамен</a>
        </div>

        {% if exams %}
            {% for exam in exams %}
            <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin: 10px 0;">
                <div style="font-size: 17px; font-weight: 700; color: #333;">{{ exam.title }}</div>
                <div style="font-size: 13px; color: #888; margin-top: 5px;">{{ exam.date }} • {{ exam.word_count }} слов</div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">Пока нет экзаменов. Начни первый!</div>
        {% endif %}
    </div>
</body>
</html>
