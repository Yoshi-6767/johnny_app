<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Johnny English</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 700px; margin: 0 auto; }

        h1 {
            color: #ff6b00;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .train-btn {
            display: inline-block;
            background: #ff6b00;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: background 0.2s;
        }

        .train-btn:hover { background: #ff8533; }

        .counter {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form input {
            flex: 1;
            min-width: 150px;
            padding: 14px 18px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form input:focus { border-color: #ff6b00; }
        .form input::placeholder { color: #666; }

        .form button {
            padding: 14px 26px;
            background: #ff6b00;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .form button:hover { background: #ff8533; }
        .form button:active { transform: scale(0.97); }

        .search { margin-bottom: 20px; }

        .search input {
            width: 100%;
            padding: 12px 18px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .search input:focus { border-color: #ff6b00; }

        ul { list-style: none; }

        li {
            background: #1e1e1e;
            padding: 16px 20px;
            margin: 8px 0;
            border-radius: 10px;
            font-size: 16px;
            border-left: 3px solid #ff6b00;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        li:hover { background: #2a2a2a; transform: translateX(4px); }

        .word-text::before {
            content: "→ ";
            color: #ff6b00;
            font-weight: bold;
        }

        .actions { display: flex; gap: 8px; }

        .actions button {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .actions button:hover { color: #fff; background: #333; }
        .actions .delete-btn:hover { color: #ff3333; }
        .actions .edit-btn:hover { color: #ff6b00; }

        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Мои слова</h1>
        <a href="/train" class="train-btn">🔥 Тренировать слова</a>
<a href="/phrases" class="train-btn" style="background: #4caf50;">💬 Мои фразы</a>
<a href="/progress" class="train-btn" style="background: #2196f3;">📊 Прогресс</a>
<a href="/train_reverse" class="train-btn" style="background: #9c27b0;">🔄 Наоборот</a>      
        <div class="counter">Всего слов: {{ words|length }}</div>

        <div class="form">
            <input id="eng" placeholder="Английское слово">
            <input id="rus" placeholder="Русский перевод">
            <button onclick="addWord()">Добавить</button>
        </div>

        <div class="search">
            <input id="search" placeholder="🔍 Поиск..." oninput="filterWords()">
        </div>

        <ul id="words-list">
            {% if words %}
                {% for eng, rus in words.items() %}
                <li data-word="{{ eng }} {{ rus }}">
                    <span class="word-text">{{ eng }} → {{ rus }}</span>
                    <div class="actions">
                        <button class="edit-btn" onclick="editWord('{{ eng }}', '{{ rus }}')">✏️</button>
                        <button class="delete-btn" onclick="deleteWord('{{ eng }}')">✖</button>
                    </div>
                </li>
                {% endfor %}
            {% else %}
                <div class="empty">Пока нет слов. Добавь первое!</div>
            {% endif %}
        </ul>
    </div>

    <script>
        function addWord() {
            const eng = document.getElementById("eng").value.trim();
            const rus = document.getElementById("rus").value.trim();
            if (!eng || !rus) return;
            fetch("/add", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({eng: eng, rus: rus})
            }).then(() => location.reload());
        }

        function deleteWord(eng) {
            if (!confirm("Удалить слово «" + eng + "»?")) return;
            fetch("/delete", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({eng: eng})
            }).then(() => location.reload());
        }

        function editWord(eng, rus) {
            const newEng = prompt("Английское слово:", eng);
            if (newEng === null) return;
            const newRus = prompt("Русский перевод:", rus);
            if (newRus === null) return;
            fetch("/edit", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({old_eng: eng, new_eng: newEng.trim(), new_rus: newRus.trim()})
            }).then(() => location.reload());
        }

        function filterWords() {
            const query = document.getElementById("search").value.toLowerCase();
            const items = document.querySelectorAll("#words-list li");
            items.forEach(item => {
                const text = item.dataset.word.toLowerCase();
                item.style.display = text.includes(query) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
