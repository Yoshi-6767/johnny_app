<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровые режимы — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/games">Игры</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🎮 Игровые режимы</h1>
        <div class="subtitle">Учись играя</div>

        <div class="cards">
            <a href="/games/hangman" class="card">
                <div>
                    <div class="card-emoji">🪢</div>
                    <div class="card-title">Виселица</div>
                    <div class="card-count">Угадай слово по буквам</div>
                </div>
            </a>

            <a href="/games/quiz" class="card">
                <div>
                    <div class="card-emoji">❓</div>
                    <div class="card-title">Квиз</div>
                    <div class="card-count">10 вопросов</div>
                </div>
            </a>

            <a href="/games/speed" class="card">
                <div>
                    <div class="card-emoji">⚡</div>
                    <div class="card-title">Скоростной</div>
                    <div class="card-count">30 секунд</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
