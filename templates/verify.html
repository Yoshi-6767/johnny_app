{% extends "base.html" %}

{% block title %}Подтверждение — Flow & Word{% endblock %}

{% block styles %}
<style>
    .auth-form {
        max-width: 400px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #bbdefb;
        border-radius: 14px;
        padding: 30px;
    }
    .auth-form h1 { text-align: center; margin-bottom: 15px; }
    .auth-form p { color: #888; text-align: center; margin-bottom: 25px; font-size: 14px; }
    .auth-form input {
        width: 100%;
        padding: 16px;
        background: #fff;
        border: 1px solid #bbdefb;
        border-radius: 10px;
        color: #333;
        font-size: 24px;
        font-family: 'Rubik', sans-serif;
        outline: none;
        margin-bottom: 15px;
        text-align: center;
        letter-spacing: 8px;
    }
    .auth-form input:focus { border-color: #2196f3; }
    .auth-form button {
        width: 100%;
        padding: 16px;
        background: #2196f3;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        font-family: 'Rubik', sans-serif;
        cursor: pointer;
    }
    .auth-form button:hover { background: #1976d2; }
    .auth-error {
        background: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>📧 Подтверждение</h1>
    <p>Мы отправили код на твой email</p>
    
    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <input name="code" placeholder="000000" maxlength="6" required autofocus>
        <button type="submit">Подтвердить</button>
    </form>
</div>
{% endblock %}
