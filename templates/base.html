<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flow & Word{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/sections">Категории</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/study">Учёба</a>
                    <a href="/games">Игры</a>
                    <a href="/progress">Прогресс</a>
                    <a href="/utils">Утилиты</a>
                </nav>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="theme-toggle" onclick="toggleTheme()" style="background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 0;">🌙</button>
                    <a href="/faq" class="faq-link">FAQ</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}

    <script>
        // Тёмная тема
        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
        }

        // Применяем тему при загрузке
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
                document.addEventListener('DOMContentLoaded', function() {
                    const btn = document.getElementById('theme-toggle');
                    if (btn) btn.textContent = '☀️';
                });
            }
        })();
    </script>
</body>
</html>
