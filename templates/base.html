<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flow & Word{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Применяем тему и цвет ДО отрисовки — чтобы не мигало
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') document.documentElement.setAttribute('data-theme-pending', 'dark');
            const accent = localStorage.getItem('accent') || 'blue';
            document.documentElement.setAttribute('data-accent-pending', accent);
        })();
    </script>
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>

    <div class="header">
        <div class="container">
            <div class="header-top">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <div class="header-right">
                    <div class="accent-picker">
                        <div class="accent-toggle" onclick="toggleAccentMenu(event)" title="Цвет сайта"></div>
                        <div class="accent-dropdown" id="accentDropdown">
                            <div class="accent-swatch" data-accent="blue" style="background: #2196f3;" onclick="setAccent('blue')"></div>
                            <div class="accent-swatch" data-accent="green" style="background: #4caf50;" onclick="setAccent('green')"></div>
                            <div class="accent-swatch" data-accent="purple" style="background: #9c27b0;" onclick="setAccent('purple')"></div>
                            <div class="accent-swatch" data-accent="pink" style="background: #e91e63;" onclick="setAccent('pink')"></div>
                            <div class="accent-swatch" data-accent="orange" style="background: #ff9800;" onclick="setAccent('orange')"></div>
                            <div class="accent-swatch" data-accent="red" style="background: #f44336;" onclick="setAccent('red')"></div>
                        </div>
                    </div>
                    <div class="theme-switch" onclick="toggleTheme()">
                        <span class="theme-icon">🌙</span>
                        <div class="theme-slider"></div>
                        <span class="theme-icon">☀️</span>
                    </div>
