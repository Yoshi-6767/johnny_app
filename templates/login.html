{% extends "base.html" %}

{% block title %}Вход — Flow Word{% endblock %}

{% block styles %}
<style>
    .auth-form {
        max-width: 400px;
        margin: 0 auto;
        background: var(--bg-card);
        border: 1px solid var(--accent-light);
        border-radius: 14px;
        padding: 30px;
    }
    .auth-form h1 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        margin-bottom: 25px;
    }
    .auth-form h1 .icon { width: 32px; height: 32px; color: var(--accent); }
    .auth-form input {
        width: 100%;
        padding: 14px 18px;
        background: var(--bg-card);
        border: 1px solid var(--accent-light);
        border-radius: 10px;
        color: var(--text);
        font-size: 15px;
        font-family: 'Rubik', sans-serif;
        outline: none;
        margin-bottom: 15px;
    }
    .auth-form input:focus { border-color: var(--accent); }
    .auth-form button {
        width: 100%;
        padding: 16px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        font-family: 'Rubik', sans-serif;
        cursor: pointer;
        margin-top: 10px;
    }
    .auth-form button:hover { background: var(--accent-dark); }
    .auth-error {
        background: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
        text-align: center;
    }
    .auth-link {
        text-align: center;
        margin-top: 20px;
        color: var(--text-sub);
        font-size: 14px;
    }
    .auth-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div class="auth-form">
    <h1><svg class="icon"><use href="#icon-key"></use></svg> Вход</h1>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input name="email" type="email" placeholder="Email" required autofocus>
        <input name="password" type="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>

    <div class="auth-link">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
