{% extends "base.html" %}

{% block title %}Вход — Flow & Word{% endblock %}

{% block styles %}
<style>
    .auth-form {
        max-width: 400px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #bbdefb;
        border-radius: 14px;
        padding: 30px;
    }
    .auth-form h1 { text-align: center; margin-bottom: 25px; }
    .auth-form input {
        width: 100%;
        padding: 14px 18px;
        background: #fff;
        border: 1px solid #bbdefb;
        border-radius: 10px;
        color: #333;
        font-size: 15px;
        font-family: 'Rubik', sans-serif;
        outline: none;
        margin-bottom: 15px;
    }
    .auth-form input:focus { border-color: #2196f3; }
    .auth-form button {
        width: 100%;
        padding: 16px;
        background: #2196f3;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        font-family: 'Rubik', sans-serif;
        cursor: pointer;
        margin-top: 10px;
    }
    .auth-form button:hover { background: #1976d2; }
    .auth-error {
        background: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
        text-align: center;
    }
    .auth-link {
        text-align: center;
        margin-top: 20px;
        color: #888;
        font-size: 14px;
    }
    .auth-link a { color: #2196f3; text-decoration: none; font-weight: 600; }
</style>
{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>🔑 Вход</h1>
    
    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <input name="email" type="email" placeholder="Email" required autofocus>
        <input name="password" type="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    
    <div class="auth-link">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
