<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic.title }} — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .topic-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .topic-header .emoji { font-size: 56px; }
        .topic-header h1 { margin: 0; }
        .helper {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .helper .label {
            color: #888;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .helper-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            background: #e3f2fd;
            color: #2196f3;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }
        .chip:hover { background: #bbdefb; }
        .topic-textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            color: #333;
            font-size: 16px;
            font-family: 'Rubik', sans-serif;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }
        .topic-textarea:focus { border-color: #2196f3; }
        .word-counter {
            text-align: right;
            color: #888;
            font-size: 14px;
            margin: 10px 0 20px;
        }
        .word-counter.ok { color: #4caf50; }
        .save-btn {
            width: 100%;
            padding: 18px;
            background: #2196f3;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-family: 'Rubik', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) { background: #1976d2; }
        .save-btn:disabled {
            background: #e0e0e0;
            color: #aaa;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #4caf50;
            display: none;
        }
        .status.show { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/games">Игры</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 700px;">
        <div class="topic-header">
            <div class="emoji">{{ topic.emoji }}</div>
            <h1>{{ topic.title }}</h1>
        </div>
        <div class="subtitle">Минимум 50 слов для сохранения</div>

        {% if topic.helper %}
        <div class="helper">
            <div class="label">💡 Слова-помощники (нажми, чтобы вставить):</div>
            <div class="helper-chips">
                {% for word in topic.helper %}
                <span class="chip" onclick="insertWord('{{ word }}')">{{ word }}</span>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <textarea id="text" class="topic-textarea" placeholder="Напиши свой текст на английском..." oninput="updateCounter()">{{ text }}</textarea>
        <div class="word-counter" id="counter">0 / 50 слов</div>

        <button class="save-btn" id="saveBtn" onclick="saveTopic()" disabled>Сохранить</button>
        <div class="status" id="status">✅ Сохранено!</div>
    </div>

    <script>
        const MIN_WORDS = 50;
        const textarea = document.getElementById("text");
        const counter = document.getElementById("counter");
        const saveBtn = document.getElementById("saveBtn");

        function countWords(text) {
            return text.trim() ? text.trim().split(/\s+/).length : 0;
        }

        function updateCounter() {
            const count = countWords(textarea.value);
            counter.textContent = count + " / " + MIN_WORDS + " слов";
            if (count >= MIN_WORDS) {
                counter.classList.add("ok");
                saveBtn.disabled = false;
            } else {
                counter.classList.remove("ok");
                saveBtn.disabled = true;
            }
        }

        function insertWord(word) {
            const pos = textarea.selectionStart;
            const text = textarea.value;
            textarea.value = text.slice(0, pos) + word + " " + text.slice(pos);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = pos + word.length + 1;
            updateCounter();
        }

        function saveTopic() {
            fetch("/topics/{{ topic.id }}/save", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: textarea.value})
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "ok") {
                    document.getElementById("status").classList.add("show");
                    setTimeout(() => document.getElementById("status").classList.remove("show"), 2000);
                } else {
                    alert(data.message || "Ошибка");
                }
            });
        }

        updateCounter();
    </script>
</body>
</html>
