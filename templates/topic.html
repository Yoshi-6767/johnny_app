<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ topic.title }} — Johnny English</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .back-btn {
            display: inline-block;
            color: #888;
            text-decoration: none;
            margin-bottom: 25px;
        }
        .back-btn:hover { color: #fff; }
        .topic-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .topic-header .emoji { font-size: 56px; }
        .topic-header h1 { color: #ff6b00; font-size: 28px; }
        .helper {
            background: #1e1e1e;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .helper .label { color: #888; font-size: 13px; margin-bottom: 10px; }
        .helper-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: #2a2a2a;
            color: #ff6b00;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip:hover { background: #333; }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus { border-color: #ff6b00; }
        .word-counter {
            text-align: right;
            color: #888;
            font-size: 14px;
            margin: 10px 0 20px;
        }
        .word-counter.ok { color: #4caf50; }
        .save-btn {
            width: 100%;
            padding: 18px;
            background: #ff6b00;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) { background: #ff8533; }
        .save-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #4caf50;
            display: none;
        }
        .status.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/topics" class="back-btn">⬅️ К топикам</a>

        <div class="topic-header">
            <div class="emoji">{{ topic.emoji }}</div>
            <h1>{{ topic.title }}</h1>
        </div>

        {% if topic.helper %}
        <div class="helper">
            <div class="label">💡 Слова-помощники (нажми, чтобы вставить):</div>
            <div class="helper-chips">
                {% for word in topic.helper %}
                <span class="chip" onclick="insertWord('{{ word }}')">{{ word }}</span>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <textarea id="text" placeholder="Напиши свой текст на английском..." oninput="updateCounter()">{{ text }}</textarea>
        <div class="word-counter" id="counter">0 / 50 слов</div>

        <button class="save-btn" id="saveBtn" onclick="saveTopic()" disabled>Сохранить</button>
        <div class="status" id="status">✅ Сохранено!</div>
    </div>

    <script>
        const MIN_WORDS = 50;
        const textarea = document.getElementById("text");
        const counter = document.getElementById("counter");
        const saveBtn = document.getElementById("saveBtn");

        function countWords(text) {
            return text.trim() ? text.trim().split(/\s+/).length : 0;
        }

        function updateCounter() {
            const count = countWords(textarea.value);
            counter.textContent = count + " / " + MIN_WORDS + " слов";
            if (count >= MIN_WORDS) {
                counter.classList.add("ok");
                saveBtn.disabled = false;
            } else {
                counter.classList.remove("ok");
                saveBtn.disabled = true;
            }
        }

        function insertWord(word) {
            const pos = textarea.selectionStart;
            const text = textarea.value;
            textarea.value = text.slice(0, pos) + word + " " + text.slice(pos);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = pos + word.length + 1;
            updateCounter();
        }

        function saveTopic() {
            const text = textarea.value;
            fetch("/topics/{{ topic.id }}/save", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: text})
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "ok") {
                    document.getElementById("status").classList.add("show");
                    setTimeout(() => {
                        document.getElementById("status").classList.remove("show");
                    }, 2000);
                } else {
                    alert(data.message || "Ошибка");
                }
            });
        }

        // При загрузке обновляем счётчик
        updateCounter();
    </script>
</body>
</html>
