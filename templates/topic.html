<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic.title }} — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>{{ topic.emoji }} {{ topic.title }}</h1>
        <div class="subtitle">Минимум 50 слов для сохранения</div>

        {% if topic.helper %}
        <div style="background: #fff; border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <div style="color: #888; font-size: 13px; margin-bottom: 12px;">💡 Слова-помощники (нажми, чтобы вставить):</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                {% for word in topic.helper %}
                <span onclick="insertWord('{{ word }}')" style="background: #e3f2fd; color: #2196f3; padding: 6px 14px; border-radius: 20px; font-size: 14px; cursor: pointer;">{{ word }}</span>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <textarea id="text" placeholder="Напиши свой текст на английском..." oninput="updateCounter()" style="width: 100%; min-height: 300px; padding: 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; color: #333; font-size: 16px; font-family: 'Rubik', sans-serif; line-height: 1.6; resize: vertical; outline: none;">{{ text }}</textarea>
        <div id="counter" style="text-align: right; color: #888; font-size: 14px; margin: 10px 0 20px;">0 / 50 слов</div>

        <button id="saveBtn" class="btn" onclick="saveTopic()" disabled style="width: 100%; opacity: 0.5;">Сохранить</button>
        <div id="status" style="text-align: center; margin-top: 15px; font-size: 14px; color: #4caf50; display: none;">✅ Сохранено!</div>
    </div>

    <script>
        const MIN_WORDS = 50;
        const textarea = document.getElementById("text");
        const counter = document.getElementById("counter");
        const saveBtn = document.getElementById("saveBtn");

        function countWords(text) {
            return text.trim() ? text.trim().split(/\s+/).length : 0;
        }

        function updateCounter() {
            const count = countWords(textarea.value);
            counter.textContent = count + " / " + MIN_WORDS + " слов";
            if (count >= MIN_WORDS) {
                counter.style.color = "#4caf50";
                saveBtn.disabled = false;
                saveBtn.style.opacity = "1";
            } else {
                counter.style.color = "#888";
                saveBtn.disabled = true;
                saveBtn.style.opacity = "0.5";
            }
        }

        function insertWord(word) {
            const pos = textarea.selectionStart;
            const text = textarea.value;
            textarea.value = text.slice(0, pos) + word + " " + text.slice(pos);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = pos + word.length + 1;
            updateCounter();
        }

        function saveTopic() {
            fetch("/topics/{{ topic.id }}/save", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: textarea.value})
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "ok") {
                    document.getElementById("status").style.display = "block";
                    setTimeout(() => document.getElementById("status").style.display = "none", 2000);
                } else {
                    alert(data.message || "Ошибка");
                }
            });
        }

        updateCounter();
    </script>
</body>
</html>
