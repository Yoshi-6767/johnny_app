{% extends "base.html" %}

{% block title %}Учёба — Flow & Word{% endblock %}

{% block content %}
<h1>📖 Учёба</h1>
<div class="subtitle">Материалы для изучения английского</div>

<div class="cards">
    <a href="/study/grammar" class="card">
        <div>
            <svg class="card-icon"><use href="/static/icons.svg#icon-book"></use></svg>
            <div class="card-title">Грамматика</div>
            <div class="card-count">10 уроков</div>
        </div>
    </a>

    <a href="/study/irregular" class="card">
        <div>
            <svg class="card-icon"><use href="/static/icons.svg#icon-pencil"></use></svg>
            <div class="card-title">Неправильные глаголы</div>
            <div class="card-count">60 самых важных</div>
        </div>
    </a>

    <a href="/study/idioms" class="card">
        <div>
            <svg class="card-icon"><use href="/static/icons.svg#icon-sparkles"></use></svg>
            <div class="card-title">Идиомы</div>
            <div class="card-count">30 самых важных</div>
        </div>
    </a>

    <a href="/dialogues" class="card">
        <div>
            <svg class="card-icon"><use href="/static/icons.svg#icon-dialogue"></use></svg>
            <div class="card-title">Диалоги</div>
            <div class="card-count">10 жизненных ситуаций</div>
        </div>
    </a>
</div>
{% endblock %}
