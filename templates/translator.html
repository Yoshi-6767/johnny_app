{% extends "base.html" %}

{% block title %}Переводчик — Flow & Word{% endblock %}

{% block styles %}
<style>
    .direction {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    .direction button {
        flex: 1;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #e0e0e0;
        background: #fff;
        color: #888;
        font-size: 15px;
        font-family: 'Rubik', sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .direction button.active {
        background: #2196f3;
        border-color: #2196f3;
        color: #fff;
    }
    .direction button:hover:not(.active) {
        border-color: #2196f3;
        color: #2196f3;
    }
    .translator-textarea {
        width: 100%;
        min-height: 150px;
        padding: 20px;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        color: #333;
        font-size: 16px;
        font-family: 'Rubik', sans-serif;
        line-height: 1.6;
        resize: vertical;
        outline: none;
        margin-bottom: 15px;
    }
    .translator-textarea:focus { border-color: #2196f3; }
    .result {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-left: 4px solid #2196f3;
        padding: 20px;
        border-radius: 12px;
        font-size: 16px;
        line-height: 1.6;
        min-height: 100px;
        white-space: pre-wrap;
        color: #333;
    }
    .result.empty {
        color: #aaa;
        font-style: italic;
    }
    body.dark .direction button { background: #1e1e1e; border-color: #2a2a2a; }
    body.dark .direction button.active { background: #2196f3; border-color: #2196f3; color: #fff; }
    body.dark .translator-textarea { background: #1e1e1e; border-color: #2a2a2a; color: #e0e0e0; }
    body.dark .result { background: #1e1e1e; border-color: #2a2a2a; color: #e0e0e0; }
    body.dark .result.empty { color: #666; }
</style>
{% endblock %}

{% block content %}
<h1>🌐 Переводчик</h1>
<div class="subtitle">Перевод слов и текстов RU ↔ EN</div>

<div class="direction">
    <button id="ru-en" class="active" onclick="setDirection('ru-en')">🇷🇺 RU → 🇬🇧 EN</button>
    <button id="en-ru" onclick="setDirection('en-ru')">🇬🇧 EN → 🇷🇺 RU</button>
</div>

<textarea id="input" class="translator-textarea" placeholder="Введи текст..."></textarea>

<button class="btn" onclick="doTranslate()" style="width: 100%; margin-bottom: 20px;">Перевести</button>

<div class="result empty" id="result">Здесь появится перевод...</div>
{% endblock %}

{% block scripts %}
<script>
    let direction = "ru-en";

    function setDirection(dir) {
        direction = dir;
        document.getElementById("ru-en").classList.toggle("active", dir === "ru-en");
        document.getElementById("en-ru").classList.toggle("active", dir === "en-ru");
    }

    function doTranslate() {
        const text = document.getElementById("input").value.trim();
        if (!text) return;
        const result = document.getElementById("result");
        result.textContent = "Переводим...";
        result.classList.remove("empty");
        fetch("/translate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text, direction: direction})
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === "ok") {
                result.textContent = data.translation;
            } else {
                result.textContent = "Ошибка: " + data.message;
            }
        });
    }

    document.getElementById("input").addEventListener("keydown", function(e) {
        if (e.ctrlKey && e.key === "Enter") doTranslate();
    });
</script>
{% endblock %}
