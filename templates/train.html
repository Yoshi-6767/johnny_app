<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тренировка — Flow & Word</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 600px; width: 100%; }
        h1 {
            color: #2ecc71;
            font-size: 26px;
            margin-bottom: 20px;
            text-align: center;
        }
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .mode-switch a {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: #1e1e1e;
            color: #888;
            transition: all 0.2s;
        }
        .mode-switch a.active {
            background: #2ecc71;
            color: #fff;
        }
        .mode-switch a:hover {
            color: #fff;
        }
        .word {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 25px;
            border-left: 4px solid #2ecc71;
        }
        .form { display: flex; gap: 10px; margin-bottom: 20px; }
        .form input {
            flex: 1;
            padding: 16px 20px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .form input:focus { border-color: #2ecc71; }
        .form button {
            padding: 16px 30px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .form button:hover { background: #27ae60; }
        .result {
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            display: none;
        }
        .result.correct {
            background: #1a3d1a;
            border-left: 4px solid #4caf50;
            color: #a5d6a7;
        }
        .result.wrong {
            background: #3d1a1a;
            border-left: 4px solid #f44336;
            color: #ef9a9a;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: #1e1e1e;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stats div { text-align: center; }
        .stats .num {
            font-size: 24px;
            font-weight: 700;
            color: #2ecc71;
        }
        .stats .label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .nav { display: flex; gap: 10px; justify-content: center; }
        .nav a {
            color: #888;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .nav a:hover { color: #fff; background: #1e1e1e; }
        .empty { text-align: center; padding: 60px 20px; color: #666; }
        .empty a { color: #2ecc71; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        {% if empty %}
            <div class="empty">
                <h1>📚 Пока нет слов</h1>
                <p>Добавь слова в <a href="/words">словаре</a>, чтобы тренироваться.</p>
            </div>
        {% else %}
            <h1>🔥 Тренировка</h1>

            <div class="mode-switch">
                <a href="/train{% if section %}?section={{ section }}{% endif %}" class="{% if not reverse %}active{% endif %}">🇬🇧 → 🇷🇺</a>
                <a href="/train?reverse=1{% if section %}&section={{ section }}{% endif %}" class="{% if reverse %}active{% endif %}">🇷🇺 → 🇬🇧</a>
            </div>

            <div class="stats">
                <div>
                    <div class="num" id="correct-count">0</div>
                    <div class="label">✅ Верно</div>
                </div>
                <div>
                    <div class="num" id="wrong-count">0</div>
                    <div class="label">❌ Ошибок</div>
                </div>
            </div>

            <div class="word">{{ word }}</div>

            <div class="result" id="result"></div>

            <div class="form">
                <input id="answer" placeholder="Введи перевод..." autofocus>
                <button onclick="checkAnswer()">Проверить</button>
            </div>

            <div class="nav">
                <a href="/train?reverse={{ '1' if reverse else '0' }}{% if section %}&section={{ section }}{% endif %}">🔄 Следующее</a>
                <a href="/">⬅️ На главную</a>
            </div>
        {% endif %}
    </div>

    <script>
        document.getElementById("answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });

        function checkAnswer() {
            const answer = document.getElementById("answer").value.trim();
            if (!answer) return;
            fetch("/check", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({answer: answer})
            })
            .then(r => r.json())
            .then(data => {
                const result = document.getElementById("result");
                result.style.display = "block";
                if (data.status === "correct") {
                    result.className = "result correct";
                    result.textContent = "✅ Верно! " + data.correct_answer;
                    document.getElementById("answer").value = "";
                    setTimeout(() => {
                        location.href = "/train?reverse={{ '1' if reverse else '0' }}{% if section %}&section={{ section }}{% endif %}";
                    }, 1200);
                } else {
                    result.className = "result wrong";
                    result.textContent = "❌ Не то. Правильно: " + data.correct_answer;
                }
                document.getElementById("correct-count").textContent = data.correct_count;
                document.getElementById("wrong-count").textContent = data.wrong_count;
            });
        }
    </script>
</body>
</html>
