<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренировка слов — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .mode-switch a {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            background: #fff;
            border: 1px solid #e0e0e0;
            color: #888;
            transition: all 0.2s;
        }
        .mode-switch a.active {
            background: #2196f3;
            border-color: #2196f3;
            color: #fff;
        }
        .mode-switch a:hover:not(.active) {
            border-color: #2196f3;
            color: #2196f3;
        }
        .word {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #2196f3;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
        }
        .train-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .train-form input {
            flex: 1;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            color: #333;
            font-size: 16px;
            font-family: 'Rubik', sans-serif;
            outline: none;
        }
        .train-form input:focus { border-color: #2196f3; }
        .result {
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            display: none;
        }
        .result.correct {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        .result.wrong {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .stats div { text-align: center; }
        .stats .num { font-size: 24px; font-weight: 700; color: #2196f3; }
        .stats .label { font-size: 13px; color: #888; margin-top: 4px; }
        .nav { display: flex; gap: 10px; justify-content: center; }
        .nav a {
            color: #888;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
        }
        .nav a:hover { color: #2196f3; background: #f5f7fa; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        {% if empty %}
            <div class="empty">
                <h1>📚 Пока нет слов</h1>
                <p>Добавь слова в <a href="/words" style="color: #2196f3;">словаре</a>, чтобы тренироваться.</p>
            </div>
        {% else %}
            <h1>🔥 Тренировка слов</h1>

            <div class="mode-switch">
                <a href="/train{% if section %}?section={{ section }}{% endif %}" class="{% if not reverse %}active{% endif %}">🇬🇧 EN → 🇷🇺 RU</a>
                <a href="/train?reverse=1{% if section %}&section={{ section }}{% endif %}" class="{% if reverse %}active{% endif %}">🇷🇺 RU → 🇬🇧 EN</a>
            </div>

            <div class="stats">
                <div>
                    <div class="num" id="correct-count">0</div>
                    <div class="label">✅ Верно</div>
                </div>
                <div>
                    <div class="num" id="wrong-count">0</div>
                    <div class="label">❌ Ошибок</div>
                </div>
            </div>

            <div class="word">{{ word }}</div>

            <div class="result" id="result"></div>

            <div class="train-form">
                <input id="answer" placeholder="Введи перевод..." autofocus>
                <button class="btn" onclick="checkAnswer()">Проверить</button>
            </div>

            <div class="nav">
                <a href="/train?reverse={{ '1' if reverse else '0' }}{% if section %}&section={{ section }}{% endif %}">🔄 Следующее</a>
                <a href="/">⬅️ На главную</a>
            </div>
        {% endif %}
    </div>

    <script>
        document.getElementById("answer").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });

        function checkAnswer() {
            const answer = document.getElementById("answer").value.trim();
            if (!answer) return;
            fetch("/check", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({answer: answer})
            })
            .then(r => r.json())
            .then(data => {
                const result = document.getElementById("result");
                result.style.display = "block";
                if (data.status === "correct") {
                    result.className = "result correct";
                    result.textContent = "✅ Верно! " + data.correct_answer;
                    document.getElementById("answer").value = "";
                    setTimeout(() => {
                        location.href = "/train?reverse={{ '1' if reverse else '0' }}{% if section %}&section={{ section }}{% endif %}";
                    }, 1200);
                } else {
                    result.className = "result wrong";
                    result.textContent = "❌ Не то. Правильно: " + data.correct_answer;
                }
                document.getElementById("correct-count").textContent = data.correct_count;
                document.getElementById("wrong-count").textContent = data.wrong_count;
            });
        }
    </script>
</body>
</html>
