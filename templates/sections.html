<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разделы — Flow & Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-inner">
                <a href="/" class="logo">Flow <span>&</span> Word</a>
                <nav class="nav">
                    <a href="/words">Слова</a>
                    <a href="/phrases">Фразы</a>
                    <a href="/topics">Топики</a>
                    <a href="/sections">Категории</a>
                    <a href="/progress">Прогресс</a>
                </nav>
                <a href="/faq" class="faq-link">FAQ</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>📚 Категории</h1>
        <div class="subtitle">Всего слов в базе: {{ total_words }}</div>

        <div class="cards">
            {% for s in sections %}
            <a href="/sections/{{ s.id }}" class="card">
                <div>
                    <div class="card-emoji">{{ s.emoji }}</div>
                    <div class="card-title">{{ s.title }}</div>
                    <div class="card-count">Слов: {{ s.count }}</div>
                </div>
            </a>
            {% endfor %}
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="/train" class="btn">🔥 Тренировать всё</a>
        </div>
    </div>
</body>
</html>
