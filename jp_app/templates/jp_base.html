<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Японский Хаб — Flow Word{% endblock %}</title>
    
    <!-- Японский шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Глобальные стили для японского хаба */
        body {
            font-family: 'Noto Serif JP', serif; 
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            background-image: radial-gradient(circle at center, #2a0000 0%, #1a1a1a 100%); 
            background-attachment: fixed;
        }
        
        .header { background-color: #1a1a1a !important; border-bottom: 1px solid #b71c1c !important; }
        .logo-text { background: none !important; -webkit-text-fill-color: #ff5252 !important; color: #ff5252 !important; font-family: 'Noto Serif JP', serif; }
        .nav a { color: #ffcccc !important; }
        .nav a:hover { color: #ff5252 !important; }
        
        /* Стили для карточек */
        .card {
            background: #2a2a2a !important;
            border: 2px solid #b71c1c !important;
            color: #fff !important;
        }
        .card:hover {
            background: #3a3a3a !important;
            border-color: #ff5252 !important;
            box-shadow: 0 4px 20px rgba(255, 82, 82, 0.3) !important;
        }
        .card-title { color: #ff5252 !important; }
        .card-count { color: #aaa !important; }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>

<!-- Японская шапка -->
<header class="header">
    <div class="container">
        <div class="header-top">
            <a href="/jp" class="logo">
                <div class="logo-img-wrap" style="background: #b71c1c; border-color: #ff5252;">
                    <!-- Твой логотип. Если он темный, filter сделает его белым -->
                    <img src="/static/logo-light.png" style="width: 100%; height: 100%; object-fit: contain; filter: brightness(0) invert(1);">
                </div>
                <span class="logo-text">Японский Хаб</span>
            </a>
            <div class="header-right">
                <!-- Кнопка выхода (пока просто ссылка) -->
                <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; background: #2a2a2a; color: #fff; text-decoration: none; font-weight: 700; border: 1px solid #b71c1c; font-family: 'Rubik', sans-serif;">
                    Выйти
                </a>
            </div>
        </div>
    </div>
</header>

<!-- КРАСИВЫЙ БАННЕР ДЛЯ ЯПОНСКОГО ХАБА -->
<div class="container" style="margin-top: 20px; margin-bottom: 20px;">
    <div style="
        background: linear-gradient(135deg, rgba(42,0,0,0.8), rgba(26,26,26,0.9));
        border: 1px solid #b71c1c;
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(183, 28, 28, 0.2);
        backdrop-filter: blur(10px);
    ">
        <div style="font-size: 14px; color: #ffcccc; font-weight: 600; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">
            Выберите режим обучения
        </div>
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <!-- Английский (Неактивный) -->
            <a href="/" style="
                display: inline-flex; align-items: center; gap: 10px;
                padding: 14px 30px; border-radius: 30px;
                background: #2a2a2a; color: #ccc; text-decoration: none;
                font-weight: 700; font-size: 16px;
                border: 2px solid #444;
                transition: all 0.2s;
            " onmouseover="this.style.borderColor='#888'; this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='#444'; this.style.transform='translateY(0)'">
                <!-- Флаг Англии (CSS) -->
                <span style="display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(to bottom, #012169 33%, #fff 33%, #fff 66%, #C8102E 66%); border: 1px solid #ddd;"></span>
                Английский
            </a>
            <!-- Японский (Активный) -->
            <a href="/jp" style="
                display: inline-flex; align-items: center; gap: 10px;
                padding: 14px 30px; border-radius: 30px;
                background: #b71c1c; color: white; text-decoration: none;
                font-weight: 700; font-size: 16px;
                border: 2px solid #b71c1c;
                box-shadow: 0 6px 15px rgba(183, 28, 28, 0.5);
                transition: transform 0.2s;
            " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                <!-- Флаг Японии (CSS) -->
                <span style="display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 1px solid #ddd; position: relative;">
                    <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: #bc002d; border-radius: 50%;"></span>
                </span>
                Японский
            </a>
        </div>
    </div>
</div>

<main class="container">
    {% block content %}{% endblock %}
</main>

</body>
</html>
