<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Японский Хаб — Flow Word{% endblock %}</title>
    
    <!-- Японский шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Глобальные стили для японского хаба */
        body {
            font-family: 'Noto Serif JP', serif; /* Японский шрифт */
            background-color: #1a1a1a !important;
            color: #ffffff !important;
            /* Фон-картинка будет добавлена позже, когда ты скачаешь с Пинтереста */
            background-image: radial-gradient(circle at center, #2a0000 0%, #1a1a1a 100%); 
            background-attachment: fixed;
        }
        
        .header { background-color: #1a1a1a !important; border-bottom: 1px solid #b71c1c !important; }
        .logo-text { background: none !important; -webkit-text-fill-color: #ff5252 !important; color: #ff5252 !important; font-family: 'Noto Serif JP', serif; }
        .nav a { color: #ffcccc !important; }
        .nav a:hover { color: #ff5252 !important; }
        
        /* Стили для карточек */
        .card {
            background: #2a2a2a !important;
            border: 2px solid #b71c1c !important;
            color: #fff !important;
        }
        .card:hover {
            background: #3a3a3a !important;
            border-color: #ff5252 !important;
            box-shadow: 0 4px 20px rgba(255, 82, 82, 0.3) !important;
        }
        .card-title { color: #ff5252 !important; }
        .card-count { color: #aaa !important; }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>

<!-- Японская шапка (упрощенная) -->
<header class="header">
    <div class="container">
        <div class="header-top">
            <a href="/jp" class="logo">
                <div class="logo-img-wrap" style="background: #b71c1c; border-color: #ff5252;">
                    <span style="color: white; font-weight: 900; font-size: 24px;">桜</span>
                </div>
                <span class="logo-text">Японский Хаб</span>
            </a>
            <div class="header-right">
                <a href="/" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; background: #2a2a2a; color: #fff; text-decoration: none; font-weight: 700; border: 1px solid #b71c1c; font-family: 'Rubik', sans-serif;">
                    🇬🇧 На английский
                </a>
            </div>
        </div>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- Подключаем иконки из твоего основного файла (если они нужны) -->
<svg xmlns="http://www.w3.org/2000/svg" style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <use href="/static/icons.svg"></use>
</svg>

</body>
</html>
